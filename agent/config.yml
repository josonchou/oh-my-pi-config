  vision: opencode-go/mimo-v2.5
  task: openai-codex/gpt-5.6-terra:medium
  reviewer: openai-codex/gpt-5.4:medium
  smol: openai-codex/gpt-5.6-luna:medium
defaultThinkingLevel: auto
hideThinkingBlock: false
tier:
  advisor: inherit
theme:
  dark: anthracite
symbolPreset: nerd
colorBlindMode: true
terminal:
  showProgress: true
display:
  shimmer: kitt
  showTokenUsage: true
images:
  blockImages: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
readLineNumbers: true
web_search:
  enabled: true
edit:
  streamingAbort: false
retry:
  fallbackChains:
    openai-codex/gpt-5.6-terra:
      - opencode-go/mimo-v2.5
    openai-codex/gpt-5.6-sol:
      - opencode-go/kimi-k2.7-code
