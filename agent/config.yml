disabledProviders:
  - opencode
  - codex
setupVersion: 2
dev:
  autoqa: true
  autoqaConsent: granted
task:
  eager: preferred
  agentModelOverrides:
    init: "@task"
    scout: "@smol"
    designer: "@designer"
    reviewer: "@reviewer"
    security-reviewer: "@reviewer"
    librarian: "@smol"
    task: "@task"
    sonic: "@tiny"
  prewalk: true
  showResolvedModelBadge: true
  enableLsp: true
modelRoles:
  default: openai-codex/gpt-6.1-sol:max
  tiny: openai-codex/gpt-6-luna
  slow: openai-codex/gpt-6-astra:xhigh
  title: "@tiny"
  commit: opencode-go/deepseek-v4.1-flash
  plan: openai-codex/gpt-6-astra:high
  advisor: opencode-go/deepseek-v4.1-flash
  designer: openai-codex/gpt-6.1-sol:high
  vision: opencode-go/deepseek-v4.1-flash
  task: openai-codex/gpt-6.1-sol:medium
  reviewer: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6-luna
defaultThinkingLevel: auto
hideThinkingBlock: false
tier:
  advisor: inherit
theme:
  dark: anthracite
symbolPreset: nerd
colorBlindMode: true
terminal:
  showProgress: true
display:
  shimmer: kitt
  showTokenUsage: true
images:
  blockImages: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
readLineNumbers: true
web_search:
  enabled: true
skills:
  ignoredSkills:
    - find-docs
    - find-skills
edit:
  streamingAbort: false
retry:
  fallbackChains:
    openai-codex/gpt-6-astra:
      - openai-codex/gpt-6.1-sol
      - opencode-go/kimi-k2.7-code
      - opencode-go/mimo-v2.5
    openai-codex/gpt-5.6-terra:
      - openai-codex/gpt-6.1-sol
      - opencode-go/mimo-v2.5
    openai-codex/gpt-6.1-sol:
      - opencode-go/kimi-k2.7-code
    openai-codex/gpt-6-luna:
      - opencode-go/gpt-6-luna
      - opencode-go/deepseek-v4.1-flash
async:
  enabled: true
recap:
  enabled: true
compaction:
  thresholdPercent: 80
  midTurnEnabled: true
  methodOrder:
    - remote
    - soft
tui:
  imeSafeCursor: true
  codexResetFireworks: true
  textSizing: true
  mouse: false
astGrep:
  enabled: true
checkpoint:
  enabled: true
composer:
  shape: pi
statusLine:
  preset: nerd
  compactThinkingLevel: true
  separator: powerline
  contextLine: annotated
steeringMode: one-at-a-time
codexResets:
  autoRedeem: "no"