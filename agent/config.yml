disabledProviders:
  - opencode
  - codex
setupVersion: 2
dev:
  autoqa: true
  autoqaConsent: granted
task:
  eager: preferred
  agentModelOverrides:
    init: "@task"
    scout: "@smol"
    designer: "@designer"
    reviewer: "@reviewer"
    security-reviewer: "@reviewer"
    librarian: "@smol"
    task: "@task"
    sonic: "@tiny"
  prewalk: true
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    enabled: true
    merge: patch
    apply: true
modelRoles:
  default: opencode-go/deepseek-v4.1-flash:high
  tiny: opencode-go/gpt-6-luna:low
  slow: opencode-go/deepseek-v4.1-flash:max
  title: "@tiny"
  commit: "@smol"
  plan: opencode-go/glm-5.3:high
  advisor: opencode-go/claude-haiku-5-5:meddium
  designer: opencode-go/deepseek-v4.1-flash:high
  vision: opencode-go/deepseek-v4.1-flash:high
  task: opencode-go/deepseek-v4.1-flash:high
  reviewer: opencode-go/deepseek-v4-pro:high
  smol: opencode-go/gpt-6-luna:low
defaultThinkingLevel: auto
hideThinkingBlock: false
tier:
  advisor: inherit
theme:
  dark: anthracite
symbolPreset: nerd
colorBlindMode: true
terminal:
  showProgress: true
display:
  shimmer: kitt
  showTokenUsage: true
images:
  blockImages: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
readLineNumbers: true
web_search:
  enabled: true
skills:
  ignoredSkills:
    - find-docs
    - find-skills
edit:
  streamingAbort: false
retry:
  fallbackChains:
    openai-codex/gpt-6-astra:
      - deepseek/deepseek-flash:max
    openai-codex/gpt-6.1-sol:
      - deepseek/deepseek-flash:high
    openai-codex/gpt-6-luna:
      - deepseek/deepseek-flash:low
    opencode-go/deepseek-v4.1-flash:
      - deepseek/deepseek-flash
    opencode-go/glm-5.3:
      - deepseek/deepseek-flash
    opencode-go/gpt-6-luna:
      - deepseek/deepseek-flash
    opencode-go/claude-haiku-5-5:
      - deepseek/deepseek-flash
async:
  enabled: true
recap:
  enabled: true
compaction:
  thresholdPercent: 80
  midTurnEnabled: true
  methodOrder:
    - remote
    - soft
tui:
  imeSafeCursor: true
  codexResetFireworks: true
  textSizing: true
  mouse: false
astGrep:
  enabled: true
checkpoint:
  enabled: true
composer:
  shape: pi
statusLine:
  preset: nerd
  compactThinkingLevel: true
  separator: powerline
  contextLine: annotated
steeringMode: one-at-a-time
codexResets:
  autoRedeem: "no"
modelPresets:
  codex:
    modelRoles:
      default: openai-codex/gpt-6.1-sol:max
      tiny: openai-codex/gpt-6-luna
      slow: openai-codex/gpt-6-astra:xhigh
      title: "@tiny"
      commit: opencode-go/deepseek-v4.1-flash:low
      plan: openai-codex/gpt-6-astra:high
      advisor: opencode-go/deepseek-v4.1-flash
      designer: openai-codex/gpt-6.1-sol:high
      vision: opencode-go/deepseek-v4.1-flash
      task: openai-codex/gpt-6.1-sol:medium
      reviewer: openai-codex/gpt-6.1-sol:high
      smol: openai-codex/gpt-6-luna
    defaultThinkingLevel: auto
  ds:
    modelRoles:
      default: opencode-go/deepseek-v4.1-flash:high
      tiny: opencode-go/gpt-6-luna:low
      slow: opencode-go/deepseek-v4.1-flash:max
      title: "@tiny"
      commit: "@smol"
      plan: opencode-go/glm-5.3:high
      advisor: opencode-go/claude-haiku-5-5:meddium
      designer: opencode-go/deepseek-v4.1-flash:high
      vision: opencode-go/deepseek-v4.1-flash:high
      task: opencode-go/deepseek-v4.1-flash:high
      reviewer: opencode-go/deepseek-v4-pro:high
      smol: opencode-go/gpt-6-luna:low
    defaultThinkingLevel: auto